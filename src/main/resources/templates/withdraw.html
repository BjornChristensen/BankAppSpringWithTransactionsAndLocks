<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Withdraw</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Withdraw Money</h1>

<table>
    <tr>
        <th>Account No</th>
        <th>Owner</th>
        <th>Balance</th>
    </tr>
    <tr>
        <td th:text="${account.accountNo}"></td>
        <td th:text="${account.owner}"></td>
        <td th:text="${account.balance}"></td>
    </tr>
</table>

<div>
    <form th:action="@{/withdraw}" method="post">

        <input type="hidden"
               name="accountNo"
               th:value="${account.accountNo}">

        <input type="hidden"
               name="balance"
               th:value="${account.balance}">

        <label>Amount:</label>
        <br>
        <input type="number"
               name="amount"
               required>
        <br>

        <button type="submit">Withdraw</button>
    </form>
</div>

</body>
</html>
