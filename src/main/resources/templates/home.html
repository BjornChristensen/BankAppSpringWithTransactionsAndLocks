<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BankAppSpringWithTransactionsAndLocks</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Bank Accounts</h1>
<table>
    <thead>
    <tr>
        <th>Account No</th>
        <th>Owner</th>
        <th>Balance</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="account : ${accounts}">
        <td th:text="${account.accountNo}"></td>
        <td th:text="${account.owner}"></td>
        <td th:text="${account.balance}"></td>
    </tr>
    </tbody>
</table>

<div>
    <h3>Deposit</h3>
    <form th:action="@{/deposit}" method="get">
        <label>Account No:</label>
        <input type="text" name="accountNo" required>
        <br>
        <button type="submit">Deposit</button>
    </form>
</div>

<div>
    <h3>Withdraw</h3>
    <form th:action="@{/withdraw}" method="get">
        <label>Account No:</label>
        <input type="text" name="accountNo" required>
        <br>
        <button type="submit">Withdraw</button>
    </form>
</div>

<div>
    <h3>Transfer</h3>
    <form th:action="@{/transfer}" method="get">
        <label>From Account:</label>
        <input type="text" name="fromAccountNo" required>
        <br>

        <label>To Account:</label>
        <input type="text" name="toAccountNo" required>
        <br>

        <button type="submit">Transfer</button>
    </form>
</div>

</body>
</html>
